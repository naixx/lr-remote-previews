[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lr-remote-previews-server"
version = "0.5.0"
description = "Builds Lightroom Classic smart previews next to the photo originals."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi",
    "pyyaml",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lrrp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
