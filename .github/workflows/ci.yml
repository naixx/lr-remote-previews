name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  web:
    name: Dashboard (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  plugin:
    name: Plug-in (lint, tests, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luarocks install busted
      - run: luacheck --config plugin/.luacheckrc plugin
      - run: busted plugin/spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.zip
          if-no-files-found: error

  image:
    name: Container image (build, start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t lr-remote-previews:ci .
      - name: Start the container and ask it for its info
        run: |
          docker run -d --name lrrp -p 8787:8787 lr-remote-previews:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/healthz
          curl -fsS http://127.0.0.1:8787/api/v1/info
          curl -fsS http://127.0.0.1:8787/ | head -c 200
      - name: Container log
        if: always()
        run: docker logs lrrp || true
